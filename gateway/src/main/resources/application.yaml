server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  profiles:
    active: dev
  cloud:
    consul:
      host: localhost
      port: 8500
    gateway:
      server:
        webmvc:
          routes:
            - id: transfer-route
              uri: lb://transfer
              predicates:
                - Path=/transfer/**
            - id: exchange-route
              uri: lb://exchange
              predicates:
                - Path=/exchange/**
  cache:
    type: caffeine

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: test

---
spring:
  config:
    activate:
      on-profile: prod