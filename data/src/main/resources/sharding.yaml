# 模式配置
mode:
  type: Standalone
  repository:
    type: JDBC

#props:
#  sql-show: true

# 数据源配置
dataSources:
  my_spring:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/my_spring?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

# 分片规则配置
rules:
  - !SHARDING
    tables:
      recharge:
        actualDataNodes: my_spring.recharge_$->{0..1}
        tableStrategy:
          complex:
            shardingColumns: trade_id,out_trade_id
            shardingAlgorithmName: trade_sharding
      withdraw:
        actualDataNodes: my_spring.withdraw_$->{0..1}
        tableStrategy:
          complex:
            shardingColumns: trade_id,out_trade_id
            shardingAlgorithmName: trade_sharding
      exchange:
        actualDataNodes: my_spring.exchange_$->{0..1}
        tableStrategy:
          complex:
            shardingColumns: trade_id,exchange_id
            shardingAlgorithmName: trade_sharding
    shardingAlgorithms:
      trade_sharding:
        type: CLASS_BASED
        props:
          strategy: COMPLEX
          algorithmClassName: com.emlyn.spring.data.component.sharding.ShardingAlgorithm
          shardingCount: 2